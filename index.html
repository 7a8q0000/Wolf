<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorDTowN | مركز العمليات والاستخبارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(0, 255, 128, 0.2);
            --primary-glow: rgba(0, 255, 128, 0.4);
            --accent-green: #00ff80;
            --accent-red: #ff3366;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 128, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 51, 102, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 128, 0.1);
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: rgba(0, 255, 128, 0.1);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 128, 0.3);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 35px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 128, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-card:hover {
            background: rgba(0, 255, 128, 0.08);
            border-color: var(--accent-green);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 128, 0.15);
        }

        .btn-card.admin {
            border-color: rgba(255, 51, 102, 0.3);
        }

        .btn-card.admin:hover {
            background: rgba(255, 51, 102, 0.08);
            border-color: var(--accent-red);
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.15);
        }

        .btn-card span.icon {
            font-size: 20px;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-badge">SYSTEM SECURE // LORDTOWN</div>
        <h1>مركز عمليات الاستخبارات</h1>
        <p>نظام رصد ومتابعة شفرات البيجر الخاصة بالسيناريو</p>

        <div class="menu-grid">
            <!-- جهاز البيجر -->
            <a href="pager.html" class="btn-card">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="icon">📟</span>
                    <span>تشغيل جهاز البيجر (للفرقة)</span>
                </div>
                <span>←</span>
            </a>

            <!-- لوحة المسؤولين -->
            <a href="admin.html" class="btn-card admin">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="icon">🔒</span>
                    <span>لوحة تحكم المسؤولين (الإرسال)</span>
                </div>
                <span>←</span>
            </a>

            <!-- موقع الشرطة العام -->
            <a href="https://7a8q0000.github.io/LorDTowN-./" class="btn-card" target="_blank">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="icon">🛡️</span>
                    <span>موقع الشرطة الرسمي</span>
                </div>
                <span>↗</span>
            </a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة لصالح سيرفر LorDTowN &copy; 2026
        </div>
    </div>

</body>
</html>
