<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorDTowN | SECURE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #02040a;
            --neon-green: #00ff66;
            --neon-red: #ff0044;
            --glass-bg: rgba(10, 15, 20, 0.85);
            --border-glow: rgba(0, 255, 102, 0.4);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.03) 0%, transparent 60%),
                linear-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .top-nav {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .logo {
            font-weight: 900;
            color: var(--neon-green);
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
        }
        .admin-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .admin-btn:hover {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.3);
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        #pagerView {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }
        .pager-header {
            text-align: center;
            border-bottom: 1px dashed var(--neon-green);
            padding-bottom: 15px;
            margin-bottom: 15px;
            color: var(--neon-green);
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-dot {
            width: 12px; height: 12px; background: #ff0044; border-radius: 50%;
            transition: 0.3s;
            display: inline-block;
        }
        .status-dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 2s infinite;
        }

        .pager-screen {
            background: #010305;
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 10px;
            height: 320px;
            overflow-y: auto;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }
        .standby-text {
            color: #334c3d;
            text-align: center;
            margin-top: 110px;
            font-family: 'Courier New', Courier, monospace;
            animation: pulse 2s infinite;
        }
        .signal-card {
            background: rgba(0, 255, 102, 0.05);
            border-right: 3px solid var(--neon-green);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .signal-code {
            color: #ffcc00;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }
        .audio-init-btn {
            width: 100%;
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
        }
        .audio-init-btn:hover { background: var(--neon-green); color: #000; }

        #adminView {
            display: none;
            width: 100%;
            max-width: 500px;
            background: rgba(15, 5, 5, 0.95);
            border: 1px solid var(--neon-red);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(255, 0, 68, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
        }
        .admin-header {
            color: var(--neon-red); text-align: center; font-weight: 900; font-size: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,68,0.3); padding-bottom: 12px;
        }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; color: #ff99aa; margin-bottom: 6px; font-size: 13px; }
        .admin-input {
            width: 100%; background: #050101; border: 1px solid rgba(255,0,68,0.4); color: #fff; padding: 12px; border-radius: 8px; outline: none; font-family: 'Cairo', sans-serif;
        }
        .admin-input:focus { border-color: var(--neon-red); box-shadow: 0 0 10px rgba(255,0,68,0.3); }
        .send-btn {
            width: 100%; background: var(--neon-red); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 17px; font-weight: 900; cursor: pointer; transition: 0.3s; font-family: 'Cairo', sans-serif;
        }
        .send-btn:hover { background: #cc0033; box-shadow: 0 0 20px rgba(255,0,68,0.5); }
        .back-btn {
            display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 13px; cursor: pointer;
        }
        .back-btn:hover { color: #fff; }

        #authModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(10px);
        }
        .auth-box {
            background: #0a0303; border: 1px solid var(--neon-red); padding: 35px; border-radius: 15px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 0 30px rgba(255,0,68,0.2);
        }
        .auth-box h2 { color: var(--neon-red); margin-top: 0; font-size: 20px; }
        .auth-input {
            width: 100%; background: #000; border: 1px solid rgba(255,0,68,0.5); color: #fff; padding: 12px; text-align: center; font-size: 22px; letter-spacing: 5px; border-radius: 8px; margin-bottom: 15px; outline: none;
        }
        .auth-btn { background: var(--neon-red); color: #fff; border: none; padding: 12px 25px; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake-error { animation: shake 0.4s ease-in-out; border-color: #ff0000 !important; }
        #errorMsg { display: none; color: #ff0000; font-weight: 900; font-size: 18px; margin-top: 12px; text-shadow: 0 0 10px #ff0000; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo">L O R D T O W N // SYS</div>
        <button class="admin-btn" onclick="openAuthModal()">⚙️ تحكم المسؤولين</button>
    </div>

    <div id="authModal">
        <div class="auth-box" id="authBox">
            <h2>⚠️ تحقق أمني صارم</h2>
            <p style="color: #888; font-size: 13px; margin-bottom: 20px;">أدخل شفرة التشفير الخاصة بالقيادة</p>
            <input type="password" id="adminPass" class="auth-input" placeholder="****">
            <button class="auth-btn" onclick="verifyPassword()">تأكيد الدخول</button>
            <div id="errorMsg">[ تم الرفض.. اذلف! ]</div>
            <div class="back-btn" onclick="closeAuthModal()">إلغاء والعودة</div>
        </div>
    </div>

    <div class="main-container">
        
        <!-- واجهة البيجر (المستقبل) -->
        <div id="pagerView">
            <div class="pager-header">
                <span>📟 SECURE PAGER</span>
                <span id="connectionStatus" class="status-dot" title="حالة الاتصال"></span>
            </div>
            <button class="audio-init-btn" id="audioBtn" onclick="initAudio()">🔊 اضغط هنا لتفعيل الصوت واستقبال الشفرات</button>
            <div class="pager-screen" id="pagerScreen">
                <div class="standby-text">[ في انتظار الإشارات الميدانية... ]</div>
            </div>
        </div>

        <!-- واجهة المسؤول (المرسل) -->
        <div id="adminView">
            <div class="admin-header">[ مركز التحكم - إرسال الشفرات ]</div>
            
            <div class="input-group">
                <label>تحديد الهدف (المستقبل):</label>
                <select id="targetUser" class="admin-input">
                    <option value="الفرقة بالكامل">الفرقة بالكامل (بث عام)</option>
                    <option value="ماثيو ستانلي">ماثيو ستانلي</option>
                    <option value="سكلر">سكلر</option>
                    <option value="بيتا">بيتا</option>
                    <option value="ليو">ليو</option>
                    <option value="سيف">سيف</option>
                    <option value="سلف">سلف</option>
                    <option value="أيمن">أيمن</option>
                </select>
            </div>

            <div class="input-group">
                <label>كود الإحداثيات (الأرقام):</label>
                <input type="text" id="signalCode" class="admin-input" placeholder="مثال: 009 - 881 - 422">
            </div>

            <div class="input-group">
                <label>محتوى الرسالة المشفرة:</label>
                <textarea id="signalText" class="admin-input" style="height: 80px;" placeholder="التعليمات أو اللغز..."></textarea>
            </div>

            <button class="send-btn" id="sendBtn" onclick="broadcastSignal()">بث الإشارة 📡</button>
            <div id="adminStatus" style="text-align: center; margin-top: 12px; font-weight: bold; font-size: 14px;"></div>
            
            <div class="back-btn" onclick="logoutAdmin()">← إغلاق اللوحة والعودة للبيجر</div>
        </div>

    </div>

    <script>
        const ADMIN_PASSWORD = "1234";
        const TOPIC = "lordtown_pager_live_v99";
        const API_URL = `https://ntfy.sh/${TOPIC}`;

        let processedIds = new Set();
        let isInitialLoad = true;
        let audioCtx = null;

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const btn = document.getElementById('audioBtn');
                btn.innerText = "✓ الصوت مفعل وجاهز لاستقبال الشفرات";
                btn.style.background = "rgba(0, 255, 102, 0.2)";
                btn.style.color = "#00ff66";
                btn.style.borderColor = "#00ff66";
            } catch(e) {}
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = 2600;
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.12);
                    }, i * 140);
                }
            } catch(e) {}
        }

        async function fetchLiveSignals() {
            try {
                // إضافة _t لمنع سفاري وقوقل من قراءة نتائج الكاش القديمة
                const noCacheUrl = `${API_URL}/json?poll=1&since=1h&_t=${Date.now()}`;
                const response = await fetch(noCacheUrl, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });

                if (!response.ok) throw new Error("Net Error");

                const text = await response.text();
                const lines = text.trim().split('\n').filter(Boolean);
                
                let receivedNew = false;

                lines.forEach(line => {
                    try {
                        const packet = JSON.parse(line);
                        if (packet.event === 'message' && packet.message) {
                            const signal = JSON.parse(packet.message);
                            if (!processedIds.has(packet.id)) {
                                processedIds.add(packet.id);
                                appendSignalToScreen(signal);
                                if (!isInitialLoad) receivedNew = true;
                            }
                        }
                    } catch(e){}
                });

                if (receivedNew) {
                    playBeep();
                }

                isInitialLoad = false;
                document.getElementById('connectionStatus').className = 'status-dot online';
            } catch (err) {
                document.getElementById('connectionStatus').className = 'status-dot';
            }
        }

        window.onload = () => {
            fetchLiveSignals();
            setInterval(fetchLiveSignals, 1500);
        };

        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
            document.getElementById('adminPass').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('authBox').classList.remove('shake-error');
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function verifyPassword() {
            const pass = document.getElementById('adminPass').value;
            const authBox = document.getElementById('authBox');
            const errorMsg = document.getElementById('errorMsg');

            if (pass === ADMIN_PASSWORD) {
                closeAuthModal();
                document.getElementById('pagerView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                authBox.classList.remove('shake-error');
                void authBox.offsetWidth; 
                authBox.classList.add('shake-error');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminView').style.display = 'none';
            document.getElementById('pagerView').style.display = 'block';
        }

        async function broadcastSignal() {
            const target = document.getElementById('targetUser').value;
            const code = document.getElementById('signalCode').value.trim();
            const text = document.getElementById('signalText').value.trim();
            const status = document.getElementById('adminStatus');
            const sendBtn = document.getElementById('sendBtn');

            if (!code || !text) {
                status.style.color = "var(--neon-red)";
                status.innerText = "⚠️ يرجى كتابة كود الإحداثيات والرسالة!";
                return;
            }

            const newSignal = {
                target: target,
                code: code,
                text: text,
                time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
            };

            sendBtn.disabled = true;
            status.style.color = "#aaa";
            status.innerText = "جاري بث الشفرة بالشبكة العامة...";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(newSignal),
                    cache: 'no-store'
                });

                if (response.ok) {
                    status.style.color = "var(--neon-green)";
                    status.innerText = "✓ تم بث الشفرة بنجاح وستصل للجميع الآن!";
                    document.getElementById('signalCode').value = '';
                    document.getElementById('signalText').value = '';
                    fetchLiveSignals();
                } else {
                    throw new Error("Send failed");
                }
            } catch (err) {
                status.style.color = "var(--neon-red)";
                status.innerText = "⚠️ خطأ في الإرسال! تأكد من اتصال النت.";
            } finally {
                sendBtn.disabled = false;
                setTimeout(() => status.innerText = '', 4000);
            }
        }

        function appendSignalToScreen(sig) {
            const screen = document.getElementById('pagerScreen');
            const standby = screen.querySelector('.standby-text');
            if (standby) standby.remove();

            const div = document.createElement('div');
            div.className = 'signal-card';
            div.innerHTML = `
                <div style="font-size: 11px; color: #668c75; margin-bottom: 4px;">[${sig.time}] المستهدف: ${sig.target}</div>
                <div class="signal-code">CODE: ${sig.code}</div>
                <div style="font-size: 13px; margin-top: 4px;">${sig.text}</div>
            `;
            screen.insertBefore(div, screen.firstChild);
        }
    </script>
</body>
</html>
