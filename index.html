<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة وزارة العدل الرسمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #0f0a05;
            --bg-card: #1a1108;
            --primary: #ff7b00;
            --primary-glow: rgba(255, 123, 0, 0.25);
            --text-light: #ffffff;
            --text-muted: #a89f94;
            --border-color: #332010;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding-bottom: 80px;
        }

        /* الهيدر */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 10, 5, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-admin-login {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-admin-login:hover {
            background: var(--primary);
            color: #000;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 20px;
        }

        /* شريط التنقل بين التبويبات */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .nav-tabs button {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-tabs button.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            text-align: center;
        }

        /* النماذج المدخلة */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--primary);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            background: #0f0a05;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-submit:hover {
            background: #ff9426;
            transform: translateY(-2px);
        }

        /* قائمة الطلبات */
        .request-item {
            background: #0f0a05;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            position: relative;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .badge-pending { background: #eab308; color: #000; }
        .badge-approved { background: var(--success); color: #000; }
        .badge-rejected { background: var(--danger); color: #fff; }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-approve {
            background: var(--success);
            color: #000;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reject {
            background: var(--danger);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-approve:hover { opacity: 0.85; }
        .btn-reject:hover { opacity: 0.85; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
        }

        .btn-download {
            background: var(--success);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <header class="header">
        <div class="logo">⚖️ وزارة العدل — دولة LSPD</div>
        <button id="loginBtn" class="btn-admin-login" onclick="toggleAdminLogin()">دخول الوزير / النائب</button>
    </header>

    <div class="container">
        
        <div class="nav-tabs">
            <button class="active" onclick="switchTab('requestTab', this)">📝 تقديم طلب إذن</button>
            <button onclick="switchTab('statusTab', this)">🔍 متابعة الطلبات</button>
            <button id="adminTabBtn" style="display: none;" onclick="switchTab('adminTab', this)">⚙️ لوحة الوزير (<span id="pendingCount">0</span>)</button>
        </div>

        <div id="requestTab" class="tab-content active card">
            <h2 class="card-title">تقديم طلب إذن قضائي جديد</h2>
            
            <div class="form-group">
                <label>اسم الضابط مقدم الطلب ورتبته:</label>
                <input type="text" id="officerName" class="form-control" placeholder="مثال: النقيب علي - LSPD">
            </div>

            <div class="form-group">
                <label>نوع الإذن القضائي المطلوب:</label>
                <select id="warrantType" class="form-control">
                    <option value="إذن تفتيش وإلقاء قبض">إذن تفتيش وإلقاء قبض (مكتمل)</option>
                    <option value="إذن تفتيش مقر / ممتلكات">إذن تفتيش مقر / ممتلكات</option>
                    <option value="إذن إلقاء قبض وتوقيف">إذن إلقاء قبض وتوقيف</option>
                    <option value="إذن مراقبة وتنصت قضائي">إذن مراقبة وتنصت قضائي</option>
                </select>
            </div>

            <div class="form-group">
                <label>المستهدف (اسم الشخص / المقر):</label>
                <input type="text" id="targetName" class="form-control" placeholder="مثال: المواطن خالد / مقر العصابة">
            </div>

            <div class="form-group">
                <label>أسباب ومبررات الطلب والأدلة المتوفرة:</label>
                <textarea id="warrantReason" class="form-control" placeholder="اكتب التفاصيل والأدلة التي تدعم هذا الطلب..."></textarea>
            </div>

            <button class="btn-submit" onclick="submitRequest()">🚀 إرسال الطلب لمراجعة الوزارة</button>
        </div>

        <div id="statusTab" class="tab-content card">
            <h2 class="card-title">متابعة حالة الأذونات الصادرة</h2>
            <div id="publicRequestsList">جاري جلب البيانات من السحابة...</div>
        </div>

        <div id="adminTab" class="tab-content card">
            <h2 class="card-title">لوحة مراجعة وأوامر وزير العدل والنائب</h2>
            <div id="adminRequestsList">جاري التحميل...</div>
        </div>

    </div>

    <script>
        // إعدادات قاعدة البيانات السحابية (Firebase)
        const firebaseConfig = {
            databaseURL: "https://moj-lspd-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let requests = [];
        let isAdmin = false;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            renderRequests();
        }

        // الاستماع الفوري لقاعدة البيانات السحابية
        database.ref('requests').on('value', (snapshot) => {
            const data = snapshot.val();
            requests = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    requests.push({ idKey: key, ...data[key] });
                });
                requests.reverse();
            }
            renderRequests();
        });

        // 1. تقديم الطلب وحفظه سحابياً
        function submitRequest() {
            const officer = document.getElementById('officerName').value.trim();
            const type = document.getElementById('warrantType').value;
            const target = document.getElementById('targetName').value.trim();
            const reason = document.getElementById('warrantReason').value.trim();

            if (!officer || !target || !reason) {
                alert("يرجى تعبئة جميع الحقول قبل الإرسال!");
                return;
            }

            const reqId = 'MOJ-' + Math.floor(10000 + Math.random() * 90000);
            const newReq = {
                id: reqId,
                officer: officer,
                type: type,
                target: target,
                reason: reason,
                status: 'pending',
                date: new Date().toLocaleDateString('ar-SA') + ' ' + new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
            };

            // حفظ الطلب في السحابة فوراً
            database.ref('requests').push(newReq, (error) => {
                if (!error) {
                    alert("✅ تم إرسال الطلب بنجاح وهو محفوظ سحابياً الآن بانتظار موافقة الوزير!");
                    document.getElementById('notifSound').play().catch(()=>{});
                    document.getElementById('targetName').value = '';
                    document.getElementById('warrantReason').value = '';
                } else {
                    alert("حدث خطأ في الاتصال بالسحابة!");
                }
            });
        }

        // 2. تسجيل دخول الوزير / النائب (كلمة المرور: 1234)
        function toggleAdminLogin() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('loginBtn').textContent = "دخول الوزير / النائب";
                document.getElementById('adminTabBtn').style.display = "none";
                switchTab('requestTab', document.querySelectorAll('.nav-tabs button')[0]);
                alert("تم تسجيل الخروج.");
            } else {
                const pass = prompt("أدخل كلمة مرور وزارة العدل للوصول للوحة التحكم:");
                if (pass === "1234") {
                    isAdmin = true;
                    document.getElementById('loginBtn').textContent = "تسجيل خروج الوزير";
                    document.getElementById('adminTabBtn').style.display = "block";
                    switchTab('adminTab', document.getElementById('adminTabBtn'));
                    alert("مرحباً بك يا سيادة الوزير / النائب!");
                } else if(pass !== null) {
                    alert("كلمة المرور غير صحيحة!");
                }
            }
        }

        // 3. التحديث المباشر لحالة الطلب في السحابة
        function updateStatus(idKey, newStatus) {
            if (newStatus === 'approved') {
                const judge = prompt("اكتب اسم القاضي / الوزير المعتمد للإذن:", "وزير العدل") || "وزير العدل";
                database.ref('requests/' + idKey).update({ status: newStatus, judgeName: judge });
            } else {
                database.ref('requests/' + idKey).update({ status: newStatus });
            }
        }

        // 4. عرض البيانات
        function renderRequests() {
            const pending = requests.filter(r => r.status === 'pending').length;
            document.getElementById('pendingCount').textContent = pending;

            const publicList = document.getElementById('publicRequestsList');
            publicList.innerHTML = requests.length ? '' : '<p style="text-align:center; color:var(--text-muted);">لا توجد طلبات مسجلة.</p>';

            requests.forEach(req => {
                let badgeClass = req.status === 'approved' ? 'badge-approved' : (req.status === 'rejected' ? 'badge-rejected' : 'badge-pending');
                let statusText = req.status === 'approved' ? '🟢 معتمد ومصرح' : (req.status === 'rejected' ? '🔴 مرفوض' : '⏳ قيد المراجعة والانتظار');

                let html = `
                    <div class="request-item">
                        <span class="badge ${badgeClass}">${statusText}</span>
                        <h3 style="color:var(--primary); font-size:16px;">${req.type} (${req.id})</h3>
                        <p style="font-size:14px; margin:6px 0;"><strong>المستهدف:</strong> ${req.target} | <strong>الضابط مقدم الطلب:</strong> ${req.officer}</p>
                        <p style="font-size:13px; color:var(--text-muted);"><strong>السبب والأدلة:</strong> ${req.reason}</p>
                        <small style="color:#777;">التاريخ: ${req.date}</small>
                `;

                if (req.status === 'approved') {
                    html += `
                        <br>
                        <button class="btn-download" onclick="generateWarrantCanvas('${req.id}')">🖼️ عرض / تنزيل الوثيقة المصورة</button>
                        <div id="canvasContainer-${req.id}"></div>
                    `;
                }

                html += `</div>`;
                publicList.innerHTML += html;
            });

            if (isAdmin) {
                const adminList = document.getElementById('adminRequestsList');
                adminList.innerHTML = requests.length ? '' : '<p style="text-align:center; color:var(--text-muted);">لا توجد طلبات متاحة.</p>';

                requests.forEach(req => {
                    let html = `
                        <div class="request-item">
                            <h3 style="color:var(--primary); font-size:16px;">${req.type} (${req.id})</h3>
                            <p style="font-size:14px; margin:5px 0;"><strong>المستهدف:</strong> ${req.target} | <strong>الضابط:</strong> ${req.officer}</p>
                            <p style="font-size:13px; color:var(--text-muted);"><strong>السبب والأدلة:</strong> ${req.reason}</p>
                            <small style="color:#777;">التاريخ: ${req.date}</small>
                            ${req.status === 'pending' ? `
                                <div class="action-btns">
                                    <button class="btn-approve" onclick="updateStatus('${req.idKey}', 'approved')">🟢 موافقة وإصدار</button>
                                    <button class="btn-reject" onclick="updateStatus('${req.idKey}', 'rejected')">🔴 رفض الطلب</button>
                                </div>
                            ` : `<p style="margin-top:10px; font-weight:bold; font-size:13px;">الحالة: ${req.status === 'approved' ? 'تمت الموافقة والإصدار' : 'تم الرفض'}</p>`}
                        </div>
                    `;
                    adminList.innerHTML += html;
                });
            }
        }

        // 5. رسم صورة الوثيقة
        function generateWarrantCanvas(id) {
            const req = requests.find(r => r.id === id);
            const container = document.getElementById(`canvasContainer-${id}`);
            
            if (container.innerHTML !== '') {
                container.innerHTML = '';
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 750;
            canvas.height = 450;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#120b05"; ctx.fillRect(0, 0, 750, 450);
            ctx.strokeStyle = "#ff7b00"; ctx.lineWidth = 5; ctx.strokeRect(12, 12, 726, 426);
            ctx.strokeStyle = "#332010"; ctx.lineWidth = 2; ctx.strokeRect(20, 20, 710, 410);

            ctx.fillStyle = "#ff7b00"; ctx.font = "bold 24px Cairo"; ctx.textAlign = "center";
            ctx.fillText("وزارة العدل — دولة LSPD", 375, 55);

            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px Cairo";
            ctx.fillText("أمر و " + req.type, 375, 90);

            ctx.strokeStyle = "#ff7b00"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(50, 105); ctx.lineTo(700, 105); ctx.stroke();

            ctx.textAlign = "right"; ctx.font = "bold 15px Cairo";
            
            ctx.fillStyle = "#ff7b00"; ctx.fillText("الرقم المرجعي:", 700, 140);
            ctx.fillStyle = "#ffffff"; ctx.fillText(req.id, 580, 140);

            ctx.fillStyle = "#ff7b00"; ctx.fillText("المستهدف:", 700, 175);
            ctx.fillStyle = "#ffffff"; ctx.fillText(req.target, 600, 175);

            ctx.fillStyle = "#ff7b00"; ctx.fillText("الضابط المنفذ:", 350, 140);
            ctx.fillStyle = "#ffffff"; ctx.fillText(req.officer, 230, 140);

            ctx.fillStyle = "#ff7b00"; ctx.fillText("المعتمد:", 350, 175);
            ctx.fillStyle = "#ffffff"; ctx.fillText(req.judgeName || "وزير العدل", 270, 175);

            ctx.fillStyle = "#1a1108"; ctx.fillRect(50, 205, 650, 130);
            ctx.strokeStyle = "#ff7b00"; ctx.strokeRect(50, 205, 650, 130);

            ctx.fillStyle = "#ff7b00"; ctx.fillText("الأسباب والمبررات المعتمدة:", 680, 230);
            ctx.fillStyle = "#dddddd"; ctx.font = "14px Cairo";
            ctx.fillText(req.reason, 680, 265);

            ctx.save();
            ctx.translate(130, 370);
            ctx.rotate(-10 * Math.PI / 180);
            ctx.strokeStyle = "rgba(34, 197, 94, 0.9)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = "rgba(34, 197, 94, 0.9)"; ctx.font = "bold 11px Cairo"; ctx.textAlign = "center";
            ctx.fillText("وزارة العدل", 0, -8);
            ctx.fillText("معتمد رسمياً", 0, 8);
            ctx.fillText("★ LSPD ★", 0, 22);
            ctx.restore();

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'btn-download';
            downloadBtn.innerHTML = '📥 تنزيل الوثيقة (PNG)';
            downloadBtn.onclick = function() {
                const link = document.createElement('a');
                link.download = `${req.id}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };

            container.appendChild(canvas);
            container.appendChild(downloadBtn);
        }
    </script>
</body>
</html>
