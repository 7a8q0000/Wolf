<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جهاز البيجر الاستخباراتي - LorDTowN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05080f;
            --pager-bg: #0d131f;
            --screen-bg: #03070c;
            --accent-green: #00ff80;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pager-container {
            width: 100%;
            max-width: 420px;
            background: var(--pager-bg);
            border: 2px solid rgba(0, 255, 128, 0.3);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 255, 128, 0.1);
            box-sizing: border-box;
        }

        .pager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .pager-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .pager-screen {
            background: var(--screen-bg);
            border: 1px solid rgba(0, 255, 128, 0.2);
            border-radius: 12px;
            padding: 15px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .signal-card {
            background: rgba(0, 255, 128, 0.03);
            border-right: 3px solid var(--accent-green);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
        }

        .signal-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .signal-code {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .signal-text {
            font-size: 13px;
            color: var(--text-main);
        }

        .standby {
            text-align: center;
            color: #4b5563;
            margin-top: 100px;
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
        }

        .audio-btn {
            background: rgba(0, 255, 128, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 12px;
            width: 100%;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        .audio-btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 128, 0.4);
        }
    </style>
</head>
<body>

    <div class="pager-container">
        <div class="pager-header">
            <span class="pager-title">SECURE PAGER // v2.6</span>
            <div class="status-dot"></div>
        </div>

        <button class="audio-btn" id="audioBtn" onclick="enableAudio()">🔊 اضغط هنا لتفعيل الصوت والاتصال</button>

        <div class="pager-screen" id="screen">
            <div class="standby">[ في انتظار استقبال إشارات الشفرات الميدانية... ]</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let lastCount = 0;

        function enableAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('audioBtn').style.display = 'none';
            alert("تم تفعيل نظام التقاط الإشارات بنجاح!");
        }

        function playPagerBeep() {
            if (!audioCtx) return;
            try {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = 2200;
                        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.08);
                    }, i * 200);
                }
            } catch(e) {}
        }

        setInterval(() => {
            let signalsList = JSON.parse(localStorage.getItem('pagerSignals') || '[]');
            if (signalsList.length > lastCount) {
                if (lastCount !== 0) {
                    playPagerBeep();
                }
                lastCount = signalsList.length;
                updateScreen(signalsList);
            }
        }, 1000);

        function updateScreen(list) {
            const screen = document.getElementById('screen');
            screen.innerHTML = '';
            list.forEach(sig => {
                const card = document.createElement('div');
                card.className = 'signal-card';
                card.innerHTML = `
                    <div class="signal-meta">[${sig.time}] إلى: ${sig.recipient}</div>
                    <div class="signal-code">CODE: ${sig.code}</div>
                    <div class="signal-text">${sig.text}</div>
                `;
                screen.appendChild(card);
            });
        }
    </script>

</body>
</html>
