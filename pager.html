<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جهاز البيجر - استقبال الشفرات</title>
    <style>
        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .pager-device {
            width: 100%;
            max-width: 450px;
            background: #111a13;
            border: 4px solid #00ff66;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
            box-sizing: border-box;
        }
        .pager-screen {
            background: #000;
            border: 2px inset #00ff66;
            padding: 15px;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        h2 {
            text-align: center;
            font-size: 18px;
            color: #00ff66;
            margin-top: 0;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .signal-card {
            background: #081a0e;
            border-left: 4px solid #00ff66;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .signal-code {
            font-weight: bold;
            color: #ffff00;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .standby {
            text-align: center;
            color: #446655;
            margin-top: 50px;
            font-size: 14px;
        }
        .activate-audio {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <div class="pager-device">
        <h2>📟 جهاز البيجر الاستخباراتي</h2>
        
        <!-- زر تفعيل الصوت (متطلبات المتصفحات الحديثة لتشغيل الصوت تلقائياً) -->
        <button class="activate-audio" id="audioBtn" onclick="enableAudio()">اضغط هنا لتفعيل استقبال التنبيهات الصوتية</button>

        <div class="pager-screen" id="screen">
            <div class="standby">[ في انتظار استقبال إشارات الشفرات...]</div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let lastCount = 0;

        function enableAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('audioBtn').style.display = 'none';
            alert("تم تفعيل جهاز البيجر بنجاح! جاهز لاستقبال الإشارات.");
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = 2000;
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    }, i * 250);
                }
            } catch(e) {}
        }

        // فحص مستمر كل ثانية إذا أرسل المسؤول شفرة جديدة
        setInterval(() => {
            let signalsList = JSON.parse(localStorage.getItem('pagerSignals') || '[]');
            
            if (signalsList.length > lastCount) {
                // إذا جاءت رسالة جديدة ويوجد صوت مفعل، اصدر التنبيه
                if (lastCount !== 0) {
                    playBeep();
                }
                lastCount = signalsList.length;
                updateScreen(signalsList);
            }
        }, 1000);

        function updateScreen(list) {
            const screen = document.getElementById('screen');
            screen.innerHTML = '';
            
            list.forEach(sig => {
                const card = document.createElement('div');
                card.className = 'signal-card';
                card.innerHTML = `
                    <div style="font-size: 11px; color: #888;">[${sig.time}] موجه إلى: ${sig.recipient}</div>
                    <div class="signal-code">الكود: ${sig.code}</div>
                    <div>${sig.text}</div>
                `;
                screen.appendChild(card);
            });
        }
    </script>

</body>
</html>
