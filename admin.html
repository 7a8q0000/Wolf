<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤولين - LorDTowN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: #111827;
            --accent-red: #ff3366;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* نافذة إدخال الباسورد */
        #authModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 17, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .auth-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 51, 51, 0.2);
        }
        .auth-box h2 {
            color: var(--accent-red);
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* اللوحة الرئيسية */
        .admin-container {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: var(--accent-red);
            font-size: 22px;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #d1d5db;
        }
        input, select, textarea {
            width: 100%;
            background: #03070c;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }
        textarea {
            height: 90px;
            resize: vertical;
        }

        .send-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .send-btn:hover {
            background: #e60039;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- نافذة طلب الرمز السري -->
    <div id="authModal">
        <div class="auth-box">
            <h2>🔒 منطقة مقيدة للمسؤولين</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">أدخل الرمز السري للوصول للوحة البث</p>
            <input type="password" id="adminPass" placeholder="الرمز السري..." style="text-align: center; margin-bottom: 15px;">
            <button class="send-btn" onclick="checkPassword()">دخول النظام</button>
            <div id="authError" style="color: #ff3366; font-size: 13px; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- لوحة التحكم الفعلية -->
    <div class="admin-container" id="adminPanel">
        <h1>[ لوحة قيادة العمليات - إرسال شفرات البيجر ]</h1>
        <div class="subtitle">إرسال التنبيهات الفورية لأجهزة البيجر الخاصة بالفرقة</div>

        <div class="form-group">
            <label for="recipient">المستقبل المستهدف:</label>
            <select id="recipient">
                <option value="الفرقة بالكامل">الفرقة بالكامل (جميع الأجهزة)</option>
                <option value="ماثيو ستانلي">ماثيو ستانلي (القائد)</option>
                <option value="سكلر">سكلر</option>
                <option value="بيتا">بيتا</option>
                <option value="ليو">ليو</option>
                <option value="سيف">سيف</option>
                <option value="سلف">سلف</option>
                <option value="أيمن">أيمن</option>
            </select>
        </div>

        <div class="form-group">
            <label for="pagerCode">كود البيجر (الأرقام المشفرة):</label>
            <input type="text" id="pagerCode" placeholder="مثال: 742 - 901 - 335">
        </div>

        <div class="form-group">
            <label for="cipherText">محتوى الشفرة / الرسالة:</label>
            <textarea id="cipherText" placeholder="اكتب نص التوجيه أو اللغز هنا..."></textarea>
        </div>

        <button class="send-btn" onclick="sendSignal()">إرسال الشفرة وبث التنبيه 📡</button>

        <div id="statusMessage"></div>
    </div>

    <script>
        // الرمز السري الخاص بالمسؤولين (يمكنك تغليفه وتغييره هنا)
        const secretPassword = "1234";

        function checkPassword() {
            const inputVal = document.getElementById('adminPass').value;
            const errorDiv = document.getElementById('authError');

            if (inputVal === secretPassword) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                errorDiv.innerText = "الرمز السري غير صحيح!";
            }
        }

        function sendSignal() {
            const recipient = document.getElementById('recipient').value;
            const pagerCode = document.getElementById('pagerCode').value.trim();
            const cipherText = document.getElementById('cipherText').value.trim();
            const statusMessage = document.getElementById('statusMessage');

            if (!pagerCode || !cipherText) {
                statusMessage.style.color = "#ff3366";
                statusMessage.innerHTML = "خطأ: يرجى ملء كود البيجر ونص الشفرة.";
                return;
            }

            const newSignal = {
                recipient: recipient,
                code: pagerCode,
                text: cipherText,
                time: new Date().toLocaleTimeString()
            };

            let signalsList = JSON.parse(localStorage.getItem('pagerSignals') || '[]');
            signalsList.unshift(newSignal);
            localStorage.setItem('pagerSignals', JSON.stringify(signalsList));

            statusMessage.style.color = "#00ff80";
            statusMessage.innerHTML = "✓ تم بث الشفرة بنجاح إلى أجهزة البيجر!";

            document.getElementById('pagerCode').value = '';
            document.getElementById('cipherText').value = '';
        }
    </script>

</body>
</html>
